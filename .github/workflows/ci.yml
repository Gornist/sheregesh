#
# Обычный CI без продуктивных секретов (ADR-0005 §3, ADR-0008).
# Нет pull_request_target; права по умолчанию пустые; actions закреплены по SHA.
# Гейт релиза здесь информационный: ожидаемый NO-GO не роняет сборку. В release.yml он блокирующий.
name: ci

on:
  push:
    branches: [v2, main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Реестр требований и тесты инструментов
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Проверка реестра (REQ-REL-002, REL-009)
        run: python3 -I tools/reqs/reqgen.py validate
      - name: Актуальность производных файлов
        run: python3 -I tools/reqs/reqgen.py generate --check
      - name: Модульные тесты инструментов
        run: python3 -m unittest discover -s tests/tools -p 'test_*.py' -v

  software:
    name: ПО на эмуляторах (L2/L3)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONPATH: software:software/emulators:software/console:software/remote
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Системные библиотеки Qt для offscreen и GStreamer для синтетического видео
        timeout-minutes: 10   # зеркало apt на раннере дважды зависало до лимита задания
        run: |
          sudo rm -f /var/lib/man-db/auto-update   # триггер man-db на раннерах тянется минутами
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT update -qq
          sudo apt-get $APT install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav util-linux
      - name: Зависимости (закреплённые версии)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tools/ci/requirements-dev.txt
      - name: Автотесты (включая два процесса, видео и длительный прогон 60 с)
        env:
          SHEREGESH_SOAK_S: "60"
          PYTHONPATH: software:software/emulators:software/console:software/remote:tests/system
        run: .venv/bin/python -m pytest -q -p no:cacheprovider --junitxml=reports/junit.xml
      - name: Снимки экранов (сокращённая матрица)
        if: always()
        env:
          PYTHONPATH: software:software/emulators:software/console:software/remote
        run: .venv/bin/python tools/dev/gallery.py reports/gallery --quick
      - name: Автотесты против реестра (уровень CI не равен PASS)
        if: always()
        run: python3 -I tools/reqs/reqgen.py evidence reports/evidence.json --out reports/evidence.md
      - name: Снимки экранов демонстрационного сценария
        if: always()
        run: .venv/bin/python -m sheregesh_console --screenshots reports/screenshots
      - name: Гейт релиза (REQ-REL-001) — информационно
        if: always()
        run: |
          python3 -I tools/reqs/reqgen.py gate | tee reports/gate.txt || echo "::notice title=Гейт релиза::NO-GO — ожидаемо до подтверждения всех Must на уровне L4"
      - name: Отчёты
        if: always()
        continue-on-error: true   # квота хранилища артефактов не должна скрывать результат тестов (2026-10-25)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ github.sha }}
          path: reports/
          retention-days: 90

  security:
    name: Секреты и границы объёма
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Секреты в отслеживаемых файлах (REQ-UPD-009)
        run: python3 -I tools/security/scan.py secrets
      - name: Компоненты вне объёма 1.0 (REQ-SYS-003)
        run: python3 -I tools/security/scan.py scope
