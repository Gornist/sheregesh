#
# Сборка лабораторного образа Raspberry Pi 4B (S2-1, ADR-0002/0006) на нативном arm64-раннере.
# Без секретов и продуктивных ключей; права только на чтение; официальный релиз не публикуется.
# Строгий вариант (без SSH) собирается всегда. Dev-вариант — только если задана переменная репозитория
# SHEREGESH_DEV_PUBKEY (открытый SSH-ключ, не секрет).
# Успешная сборка не равна загрузке Pi: tryboot, A/B-откат, дисплей, производительность — NOT TESTED.
name: image

on:
  push:
    branches: [v2]
    paths: ["os/**", "tools/image/**", ".github/workflows/image.yml"]
    tags: ["image-*"]
  workflow_dispatch:
    inputs:
      publish:
        # artifact — артефакт Actions (квота хранилища артефактов, retention 3 дня);
        # release — ЧЕРНОВИК выпуска lab-image-<sha> (prerelease) с ассетами; квоту артефактов не расходует.
        # Черновик видят только пользователи с правом записи в репозиторий; тег создаётся лишь при публикации.
        description: "Куда выгрузить образ"
        type: choice
        options: [artifact, release]
        default: artifact

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Образ Pi 4 (${{ matrix.variant }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [sheregesh-lab-pi4, sheregesh-lab-dev-pi4]
    env:
      DEV_PUBKEY: ${{ vars.SHEREGESH_DEV_PUBKEY }}
      # S3.1-DEPLOY: открытый ключ подписи выпусков (DEV deploy, OTA), отдельный от ключа входа; для dev обязателен.
      DEPLOY_PUBKEY_TEXT: ${{ vars.SHEREGESH_DEPLOY_PUBKEY }}
    steps:
      - name: Пропуск dev-варианта без открытого ключа
        id: gate
        run: |
          if [[ "${{ matrix.variant }}" == *-dev-* && -z "$DEV_PUBKEY" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::dev-вариант пропущен: нет vars.SHEREGESH_DEV_PUBKEY"
          fi
          if [[ "${{ matrix.variant }}" == *-dev-* && -n "$DEV_PUBKEY" && -z "$DEPLOY_PUBKEY_TEXT" ]]; then
            echo "::error::нет vars.SHEREGESH_DEPLOY_PUBKEY: dev-образ без отдельного ключа подписи не собирается"; exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.skip != '1'
        with:
          persist-credentials: false
      - name: Место на диске
        if: steps.gate.outputs.skip != '1'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /
      - name: Зависимости сборки
        timeout-minutes: 10   # зеркало apt на раннере дважды зависало до лимита задания
        if: steps.gate.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-l10n-tools zstd python3-yaml e2fsprogs mtools git
          sudo chmod o+x /home/runner
          WORK="$PWD/build/sheregesh-image-work"
          mkdir -p "$WORK"
          git init -q "$WORK/rpi-image-gen"
          git -C "$WORK/rpi-image-gen" remote add origin https://github.com/raspberrypi/rpi-image-gen.git
          git -C "$WORK/rpi-image-gen" fetch -q --depth 1 origin "$(cat os/rpi-image-gen.ref)"
          git -C "$WORK/rpi-image-gen" checkout -q FETCH_HEAD
          sudo "$WORK/rpi-image-gen/install_deps.sh"
      - name: Сборка и проверка структуры
        if: steps.gate.outputs.skip != '1'
        run: |
          if [[ "${{ matrix.variant }}" == *-dev-* ]]; then
            printf '%s\n' "$DEV_PUBKEY" > "$RUNNER_TEMP/dev.pub"; export SSH_PUBKEY="$RUNNER_TEMP/dev.pub"
            printf '%s\n' "$DEPLOY_PUBKEY_TEXT" > "$RUNNER_TEMP/deploy.pub"; export DEPLOY_PUBKEY="$RUNNER_TEMP/deploy.pub"
          fi
          OUT="$PWD/build/image/${{ matrix.variant }}" os/build.sh "${{ matrix.variant }}"
      - name: Сводка
        if: always() && steps.gate.outputs.skip != '1'
        run: |
          d="build/image/${{ matrix.variant }}"
          ls -la "$d" || true
          df -h /
          python3 -I - "$d/verify.json" <<'EOF' >> "$GITHUB_STEP_SUMMARY" || true
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"## {r['image']}: {r['verdict']} {r['counts']}\n")
          print("| Проверка | Итог | Подробности |\n|---|---|---|")
          for c in r["checks"]:
              print(f"| {c['desc']} | {c['status']} | {c['detail'][:80]} |")
          print("\nNOT TESTED: " + ", ".join(r["not_tested"]))
          EOF
      # Режим release: файлы передаются задаче publish через кэш Actions (не квота артефактов); сборочная задача
      # остаётся только с правом чтения, право записи (contents: write) — только у короткой задачи publish.
      - name: Файлы для выпуска
        id: rel
        if: success() && steps.gate.outputs.skip != '1' && inputs.publish == 'release'
        run: |
          d="build/image/${{ matrix.variant }}"; r="build/release/${{ matrix.variant }}"
          mkdir -p "$r"
          for f in "$d"/*.img.zst "$d"/*.deb "$d"/*.packages.tsv "$d"/*.sbom.zst "$d"/verify.json \
                   "$d"/build-report.json "$d"/SHA256SUMS "$d"/build.log; do
            [[ -f "$f" ]] && cp "$f" "$r/${{ matrix.variant }}--$(basename "$f")"
          done
          ls -la "$r"
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: steps.rel.outcome == 'success'
        with:
          path: build/release/${{ matrix.variant }}
          key: image-release-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.gate.outputs.skip != '1' && inputs.publish != 'release'
        with:
          name: ${{ matrix.variant }}-${{ github.sha }}
          path: |
            build/image/${{ matrix.variant }}/*.img.zst
            build/image/${{ matrix.variant }}/*.deb
            build/image/${{ matrix.variant }}/*.packages.tsv
            build/image/${{ matrix.variant }}/*.sbom.zst
            build/image/${{ matrix.variant }}/verify.json
            build/image/${{ matrix.variant }}/build-report.json
            build/image/${{ matrix.variant }}/SHA256SUMS
            build/image/${{ matrix.variant }}/build.log
          retention-days: 3   # образы по ~760 МБ: квота хранилища артефактов (2026-10-25 исчерпана)
          compression-level: 0
          if-no-files-found: warn

  # Черновик выпуска с образами (только workflow_dispatch с publish=release). Черновик в приватном репозитории
  # видят только пользователи с правом записи; публикация (и создание тега lab-image-<sha>) — вручную владельцем.
  # Тег lab-image-* не совпадает с фильтром push tags image-*: публикация не запускает сборку повторно.
  publish:
    name: Черновик выпуска с образами
    needs: image
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish == 'release' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: lab-image-${{ github.sha }}
    steps:
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/release/sheregesh-lab-pi4
          key: image-release-sheregesh-lab-pi4-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/release/sheregesh-lab-dev-pi4
          key: image-release-sheregesh-lab-dev-pi4-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Выгрузка в черновик выпуска
        run: |
          shopt -s nullglob
          files=(build/release/*/*)
          (( ${#files[@]} )) || { echo "::error::нет файлов образа для выпуска (сборка не удалась?)"; exit 1; }
          ls -la build/release/*/
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Лабораторный образ Pi 4 ${GITHUB_SHA::7} (черновик, не релиз)" \
              --notes "Сборка CI ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Лабораторный образ, не официальный выпуск; NOT TESTED на платах. Проверка: SHA256SUMS каждого варианта."
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release view "$TAG" --json isDraft,assets --jq '{isDraft, assets: [.assets[] | {name, size}]}'
