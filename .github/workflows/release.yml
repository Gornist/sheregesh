#
# Релизный конвейер (заготовка S1). Гейт REQ-REL-001 БЛОКИРУЮЩИЙ: обходить его нельзя.
# Подписи и публикации здесь пока нет — они добавляются на этапе S5 по ADR-0005
# (отдельный job в Environment `release` с ручным одобрением владельца).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  gate:
    name: Гейт релиза (блокирующий)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Проверка реестра
        run: python3 -I tools/reqs/reqgen.py validate && python3 -I tools/reqs/reqgen.py generate --check
      - name: Секреты
        run: python3 -I tools/security/scan.py secrets
      - name: Гейт REQ-REL-001 — все Must PASS на требуемом уровне
        # Без `|| true`: любой Must без PASS останавливает релиз.
        run: python3 -I tools/reqs/reqgen.py gate
