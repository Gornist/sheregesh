#
# Длительный прогон программного стенда на Linux (TEST-SW-001, уровень L3; не заменяет L4 на Pi 4).
# Запуск: метка soak-* (например, soak-10800-3fe0eca) или вручную. Секретов нет, права только на чтение.
# Длительность — из имени метки (soak-<секунды>-...) или входа seconds; по умолчанию 3 ч.
name: soak

on:
  push:
    tags: ["soak-*"]
  workflow_dispatch:
    inputs:
      seconds:
        description: Длительность прогона, с
        default: "10800"

permissions: {}

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Длительный прогон (Linux, offscreen)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 300
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Системные библиотеки Qt и GStreamer
        timeout-minutes: 10   # зеркало apt на раннере дважды зависало до лимита задания
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav util-linux
      - name: Зависимости (закреплённые версии)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tools/ci/requirements-dev.txt
      - name: Длительность и условия прогона
        id: cfg
        env:
          INPUT_SECONDS: ${{ inputs.seconds }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          s="${INPUT_SECONDS:-}"
          if [[ -z "$s" && "$REF_NAME" =~ ^soak-([0-9]+) ]]; then s="${BASH_REMATCH[1]}"; fi
          s="${s:-10800}"
          [[ "$s" =~ ^[0-9]+$ ]] || { echo "недопустимая длительность: $s"; exit 1; }
          echo "seconds=$s" >> "$GITHUB_OUTPUT"
          mkdir -p reports/soak
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "soak.py: $(git log -1 --format=%h -- tools/dev/soak.py)"
            echo "seconds: $s"
            echo "runner: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "nproc: $(nproc)"
            lscpu | grep -E 'Model name|^CPU\(s\)'
            free -m | sed -n 2p
            .venv/bin/python --version
            .venv/bin/python -c 'import PySide6; print("PySide6", PySide6.__version__)'
            gst-launch-1.0 --version | sed -n 2p
            echo "load: только прогон; параллельных заданий на раннере нет"
          } | tee reports/soak/conditions.txt
      - name: Прогон
        env:
          PYTHONPATH: software:software/emulators:software/console:software/remote
        run: |
          (while sleep 60; do echo "$(date -u +%FT%TZ) $(cut -d' ' -f1-3 /proc/loadavg)"; done) > reports/soak/loadavg.txt &
          set +e
          .venv/bin/python tools/dev/soak.py "${{ steps.cfg.outputs.seconds }}" --out reports/soak > reports/soak/summary.json
          echo "rc=$?" | tee reports/soak/rc.txt
          kill %1
          cat reports/soak/summary.json
      - name: Процессы после завершения
        if: always()
        run: |
          sleep 5
          pgrep -fl 'gst-launch|sheregesh_remote|sheregesh_console|pdeath' | tee reports/soak/leftover-processes.txt || echo "нет" | tee reports/soak/leftover-processes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: soak-${{ steps.cfg.outputs.seconds }}-${{ github.sha }}
          path: reports/soak/
          retention-days: 30
      - name: Вердикт
        run: grep -q '^rc=0$' reports/soak/rc.txt
