# METABEGIN
# X-Env-Layer-Name: sheregesh-base
# X-Env-Layer-Category: suite
# X-Env-Layer-Desc: Raspberry Pi OS trixie arm64 base for Sheregesh: Debian trixie
#  plus Raspberry Pi archive, without SSH, Wi-Fi and Bluetooth stacks (ADR-0002).
#  Time: systemd-timesyncd clock file (fake-hwclock is masked on trixie;
#  RTC pending AUD-012).
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: debian-trixie-arm64-multi,
#  rpi-debian-trixie,
#  rpi-misc-utils,
#  rpi-essential-base,
#  rpi-misc-skel,
#  systemd-net-min,
#  systemd-timesyncd
# METAEND
---
mmdebstrap:
  setup-hooks:
    - |-
      # Кэш .deb в постоянном рабочем томе сборки (/work/cache/debs): скачивание ≈ 200 МБ шло каждый раз (28–69 с, главный
      # случайный шум времени сборки). apt сверяет размер и SHA-256 файла в archives с подписанным индексом репозитория и
      # перекачивает несовпавший — кэш не ослабляет проверку подлинности. Нет каталога (сборка вне сервиса) — как раньше.
      cache="${SHEREGESH_WORK:-/work}/cache/debs"
      if [ -d "$cache" ] && ls "$cache"/*.deb >/dev/null 2>&1; then
        mkdir -p $1/var/cache/apt/archives
        cp -n "$cache"/*.deb $1/var/cache/apt/archives/
        echo "debs-cache: подложено $(ls "$cache"/*.deb | wc -l) пакетов"
      fi
  customize-hooks:
    - |-
      # Скачанные пакеты — в кэш до очистки apt (cleanup50-apt-cache). Собственный пакет проекта не кэшируем (он из
      # tmp, не из репозитория). Старше 21 дня — удаляются, общий размер ограничен ≈ 3 ГБ.
      cache="${SHEREGESH_WORK:-/work}/cache/debs"
      if [ -d "${SHEREGESH_WORK:-/work}/cache" ] && ls $1/var/cache/apt/archives/*.deb >/dev/null 2>&1; then
        mkdir -p "$cache"
        cp -n $1/var/cache/apt/archives/*.deb "$cache"/
        find "$cache" -name '*.deb' -mtime +21 -delete
        while [ "$(du -sm "$cache" | cut -f1)" -gt 3072 ]; do
          oldest=$(ls -tr "$cache"/*.deb | head -n1); [ -n "$oldest" ] || break; rm -f "$oldest"
        done
        echo "debs-cache: в кэше $(ls "$cache"/*.deb | wc -l) пакетов, $(du -sm "$cache" | cut -f1) МиБ"
      fi
