# Шерегеш (ADR-0017): время между платами без интернета. Источников здесь нет: роль платы известна только при работе,
# источники и права задаёт sheregesh-time (chronyc) — пульт: пул Debian и local stratum 10, allow блоку; блок: только
# пульт. Без RTC часы после загрузки могут отставать на время простоя: шаг разрешён в любой момент (> 1 с).
# drift-файл — в общем /persistent (не в /var слота): chronyd -s ставит часы по его mtime при загрузке, и время не
# откатывается ни после выключения, ни после OTA; sheregesh-time save продвигает mtime раз в 10 мин и при остановке.
driftfile /persistent/chrony/chrony.drift
makestep 1 -1
# Команды — только через локальный сокет (root); UDP-порт команд закрыт.
cmdport 0
# Клиентам NTP отказано всем, кроме localhost: строка allow нужна, чтобы chronyd открыл порт сервера при запуске —
# пульт затем разрешает адрес блока (chronyc allow), на блоке разрешений больше нет.
allow 127.0.0.1
allow ::1
leapsectz right/UTC
