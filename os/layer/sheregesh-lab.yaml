# METABEGIN
# X-Env-Layer-Name: sheregesh-lab
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: Sheregesh laboratory console: the sheregesh .deb (console GUI
#  under cage and the remote unit emulator, loopback only, synthetic data),
#  Wi-Fi and Bluetooth disabled in config.txt, package manifest inside the image.
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: sheregesh-base,device-user-admin,rpi-boot-firmware
# X-Env-Layer-RequiresProvider: sheregesh-net
#
# X-Env-VarPrefix: sheregesh
#
# X-Env-Var-assetdir: ${DIRECTORY}/sheregesh-lab.d
# X-Env-Var-assetdir-Desc: Layer assets; pkgs/ holds the sheregesh .deb built by
#  tools/image/build_deb.py before the image build.
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - ca-certificates
    # uid DynamicUser (эмулятор) разрешается через NSS-модуль systemd; без него GLib и GStreamer
    # предупреждают «unknown user id» (найдено в S2-BOOT на pi2).
    - libnss-systemd
  customize-hooks:
    - |-
      set -eu
      ls "$IGconf_sheregesh_assetdir"/pkgs/sheregesh_*_all.deb >/dev/null
      mkdir -p $1/tmp/sheregesh-debs
      cp "$IGconf_sheregesh_assetdir"/pkgs/sheregesh_*_all.deb $1/tmp/sheregesh-debs/
      chroot $1 sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/sheregesh-debs/*.deb'
    - |-
      set -eu
      # ADR-0002: версия 1.0 работает только по проводу — Wi-Fi и Bluetooth выключены оверлеями.
      printf '\n[all]\n# Sheregesh (ADR-0002): wired only\ndtoverlay=disable-wifi\ndtoverlay=disable-bt\n' \
        >> $1/boot/firmware/config.txt
    # sheregesh-ota.socket и sheregesh-ota-boot (S3.1-DEPLOY) включены всегда, но работают только при открытом
    # ключе подписи владельца (/etc/sheregesh/deploy/allowed_signers — только dev-образ).
    - $BDEBSTRAP_HOOKS/enable-units "$1" seatd sheregesh-remote-emu sheregesh-console sheregesh-remote-net sheregesh-health.timer sheregesh-ota.socket sheregesh-ota-boot sheregesh-var-seed
    - |-
      set -eu
      # Найдено при первой загрузке на Pi 4 (S2-BOOT), корень только для чтения:
      # console-setup пишет кэш раскладки в /etc при каждой загрузке — готовим кэш при сборке.
      chroot $1 setupcon --force --save-only || chroot $1 systemctl mask console-setup.service
      # Кэш годен, только если он СТРОГО новее /etc/default/{keyboard,console-setup} (console-setup.sh: -nt, setupcon:
      # -ot). mke2fs ≥ 1.47.1 зажимает все mtime новее SOURCE_DATE_EPOCH к нему — конфиг и кэш, созданные при
      # сборке, получали одно время, служба пересоздавала кэш в ro-корне и падала (E2E-13, OTA pi1; сборка devbox,
      # e2fsprogs 1.47.2; в CI 1.47.0 зажима нет). Явный порядок не зависит от версии e2fsprogs: конфиги — SDE−1, кэш — SDE.
      if ls $1/etc/console-setup/cached_* >/dev/null 2>&1; then
        sde=${SOURCE_DATE_EPOCH:?}
        touch -m -d "@$((sde - 1))" $1/etc/default/keyboard $1/etc/default/console-setup
        touch -h -m -d "@$sde" $1/etc/console-setup/cached_*
      fi
      # rpi-eeprom-update готовит обновление загрузчика записью в /boot/firmware; обновление EEPROM —
      # отдельная явная процедура, не автоматическая (влияет на tryboot, ADR-0006).
      chroot $1 systemctl mask rpi-eeprom-update.service
      # systemd-resolved: LLMNR и mDNS слушали 0.0.0.0:5355 в локальной сети — лишняя поверхность (ADR-0002).
      mkdir -p $1/etc/systemd/resolved.conf.d
      printf '[Resolve]\nLLMNR=no\nMulticastDNS=no\n' > $1/etc/systemd/resolved.conf.d/90-sheregesh.conf
    - |-
      set -eu
      # Манифест (ADR-0002, DOC-006): пакет, версия, архитектура, SHA-256 .deb из индекса репозитория.
      # Собственный пакет помечается local и хешируется отдельно в отчёте сборки.
      mkdir -p $1/usr/share/sheregesh
      # Формат dpkg-query -W по умолчанию: «пакет[:арх]<TAB>версия» (без шаблона с фигурными скобками).
      chroot $1 dpkg-query -W | LC_ALL=C sort > $1/tmp/pkgs.tsv
      while IFS="$(printf '\t')" read -r p v; do
        h=$(chroot $1 apt-cache show "$p=$v" 2>/dev/null | awk '/^SHA256:/{print $2; exit}')
        printf '%s\t%s\t%s\n' "$p" "$v" "${h:-local}"
      done < $1/tmp/pkgs.tsv > $1/usr/share/sheregesh/image-packages.tsv
      rm -f $1/tmp/pkgs.tsv
  cleanup-hooks:
    - rm -rf $1/tmp/sheregesh-debs
    - |-
      set -eu
      # S3.2-OTA: образец /var этого образа на системном разделе (только чтение). image-rota позже переносит /var
      # на persistent образа; поток обновления A/B несёт только boot и system — без образца новый слот получил бы
      # почти пустой /var. Журнал (bind на persistent) и временные файлы не входят. Время — SOURCE_DATE_EPOCH.
      mkdir -p $1/usr/share/sheregesh
      tar -C $1/var --numeric-owner --sort=name --mtime="@${SOURCE_DATE_EPOCH:-0}" \
          --exclude=./log/journal --exclude='./tmp/*' --exclude='./cache/apt/*' --exclude='./lib/apt/lists/*' \
          -cf - . | gzip -n -9 > $1/usr/share/sheregesh/var-seed.tar.gz
      tar -tzf $1/usr/share/sheregesh/var-seed.tar.gz ./lib/dpkg/status >/dev/null
