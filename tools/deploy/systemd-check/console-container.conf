# Только для контейнерного испытания: подставной «пульт» без Qt, cage, сеанса входа (PAMName) и TTY.
# Запускается через тот же launcher (обёртка /usr/bin/sheregesh-remote-emu → выпуск или /usr), от sheregesh-ui,
# Type=notify с WatchdogSec и ограничением перезапусков — как настоящий пульт. Порт 7701, только 127.0.0.1.
[Service]
PAMName=
TTYPath=
IPAddressDeny=
IPAddressAllow=
ExecStart=
ExecStart=/usr/bin/sheregesh-remote-emu --host 127.0.0.1 --port 7701
