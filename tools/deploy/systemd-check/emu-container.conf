# Только для контейнерного испытания: без синтетического видео (нет GStreamer) и без BPF-фильтра адресов
# (в контейнере может быть недоступен). Остальное — юнит образа как есть (DynamicUser, Type=notify, WatchdogSec).
[Service]
IPAddressDeny=
IPAddressAllow=
ExecStart=
ExecStart=/usr/bin/sheregesh-remote-emu --host 127.0.0.1 --port 7700
