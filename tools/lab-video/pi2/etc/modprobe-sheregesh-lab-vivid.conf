# Лабораторный dev-образ: vivid загружается только службой sheregesh-lab-vivid (не при старте).
# vivid-000: вход S-Video (аналог, PAL/NTSC) + выход; vivid-001: вход HDMI + выход — та же раскладка, что на shcam.
options vivid n_devs=2 node_types=0x101,0x101 num_inputs=1,1 input_types=0x2,0x3 num_outputs=1,1 output_types=0x0,0x1
