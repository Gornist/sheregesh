# shcam: два экземпляра vivid — эмуляция входов захвата для стенда sheregesh (tools/lab-video/README.md).
#   vivid-000: вход S-Video (аналог CVBS, PAL/NTSC) + выход S-Video — петля «выход → вход»;
#   vivid-001: вход HDMI (DV timings) + выход HDMI.
# node_types 0x101 — только узлы захвата и вывода видео; input_types 2 = S-Video, 3 = HDMI; output_types 0 = S-Video, 1 = HDMI.
options vivid n_devs=2 node_types=0x101,0x101 num_inputs=1,1 input_types=0x2,0x3 num_outputs=1,1 output_types=0x0,0x1
