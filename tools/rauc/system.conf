# RAUC: лабораторная конфигурация прототипа варианта C ADR-0009 (ADR НЕ утверждён; в образ НЕ входит).
# Цель: /etc/rauc/system.conf будущего dev-образа стенда Pi 4. Разметка image-rota (GPT):
#   p1 bootconfig (FAT, autoboot.txt) | p2 boot_a | p3 boot_b | p4 system_a | p5 system_b | p6 persistent
# RAUC решает (установка, mark-good/mark-bad); загрузчик — tryboot прошивки через бэкенд custom
# (sheregesh.update.rauc_backend); /var слота, отпечатки и критерии подтверждения — sheregesh.update.rauc_hooks.
# Устройства — /dev/mmcblk0pN, а не by-partlabel: метки image-rota одинаковы на любой карте этого образа, и карта
# в USB-картридере дала бы вторую пару system_a/system_b. Испытание на файловом образе подставляет loop-устройства.

[system]
compatible=sheregesh-lab-pi4-dev-1
bootloader=custom
# Центральный файл статуса RAUC — на общем разделе: переживает переключение слотов
data-directory=/persistent/rauc
# Только verity-бандлы (dm-verity, проверка при чтении); устаревший plain не принимается
bundle-formats=-plain
# Устаревшая версия бандла не ставится (AUD-014): решение владельца по ADR-0005, пока не задано

[keyring]
# Корневой сертификат подписи (X.509). В лаборатории — тестовый CA (tools/rauc/testpki.py), в Git не хранится
path=/etc/rauc/keyring.pem
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/libexec/sheregesh/rauc-tryboot-backend
pre-install=/usr/libexec/sheregesh/rauc-pre-install
post-install=/usr/libexec/sheregesh/rauc-post-install

[slot.rootfs.0]
device=/dev/mmcblk0p4
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p5
type=ext4
bootname=B

# boot — зависимый слот: пишется вместе со своим rootfs, своего bootname нет (выбор слота — по разделу boot в
# autoboot.txt, бэкенд сопоставляет A ↔ p2, B ↔ p3)
[slot.boot.0]
device=/dev/mmcblk0p2
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/mmcblk0p3
type=vfat
parent=rootfs.1
